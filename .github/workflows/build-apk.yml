name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "codex/**" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "web/**"
      - "shared/**"
      - "tools/**"
  push:
    branches: [ "main", "codex/**" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "web/**"
      - "shared/**"
      - "tools/**"

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css', 'web/data/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-
      - run: npm ci
      - run: mkdir -p reports
      - run: npm run test:ci
      - run: npm audit --audit-level=high
      - run: npm run validate:catalog
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run measure:build
      - run: npm run benchmark:discovery
      - run: npm run test:smoke
      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-test-reports
          path: web/reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Debug
            apk: app/build/outputs/apk/debug/app-debug.apk
          - variant: Release
            apk: app/build/outputs/apk/release/app-release-unsigned.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Run regression tests
        run: gradle --no-daemon --stacktrace test${{ matrix.variant }}UnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lint${{ matrix.variant }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-test-reports-${{ matrix.variant }}
          path: |
            app/build/reports/tests/test${{ matrix.variant }}UnitTest/
            app/build/test-results/test${{ matrix.variant }}UnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK (release remains unsigned)
        run: gradle --no-daemon --stacktrace assemble${{ matrix.variant }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: telegram-electric-${{ matrix.variant }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14
